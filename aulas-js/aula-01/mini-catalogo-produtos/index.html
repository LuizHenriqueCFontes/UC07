<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
    <title>Mini Catálogo de Produtos</title>
</head>
<body>
    <div class="container">
        <h2>Mini Catálogo de Produto</h2>

        <input id="produto" type="text" placeholder="Digite o nome do produto">

        <div class="buttons">
            <button class="btn-add" onclick="adicionarProduto()">Adicionar</button>
            <button class="btn-list" onclick="mostrarProdutos()">Mostrar Lista</button>
            <button class="btn-count" onclick="contarProdutos()">Total</button>
        </div>

        <div id="resultado"></div>
    </div>
</body>
</html>
