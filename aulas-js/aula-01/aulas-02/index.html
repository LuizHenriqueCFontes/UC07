<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
    <title>Login</title>
</head>
<body>
    
    <div class="login-box">
        <h2>Login do Sistema</h2>

        <form id="formLogin" autocomplete="on">
            <input id="usuario" type="text" required placeholder="Usuario" maxlength="255" minlength="3">
            <input type="password" name="password" id="senha" required placeholder="Senha" minlength="2" maxlength="155">

            <button type="submit">Entrar</button>
        </form>

        <div class="mensagem" id="mensagem"></div>
    </div>
</body>
</html>
